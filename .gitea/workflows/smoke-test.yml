name: Smoke Test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      AUTH_THROTTLE_SECRET: ci-only-auth-throttle-secret-at-least-32-characters
      PUBLIC_APP_URL: https://localhost
      MAIL_FROM: noreply@localhost
      CADDY_SITE_ADDRESS: localhost
      CADDY_HTTP_PORT: "18080"
      CADDY_HTTPS_PORT: "18443"
      ALLOW_REGISTRATION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full-stack smoke test
        run: |
          make smoke-test

