name: Smoke Test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      AUTH0_DOMAIN: ci-tenant.example.auth0.com
      AUTH0_CLIENT_ID: ci-spa-client
      AUTH0_AUDIENCE: https://api.ci.folio.example
      CADDY_SITE_ADDRESS: localhost
      CADDY_HTTP_PORT: "18080"
      CADDY_HTTPS_PORT: "18443"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full-stack smoke test
        run: |
          make smoke-test

