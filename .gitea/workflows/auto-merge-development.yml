name: Auto Merge Development

on:
  push:
    branches:
      - development

permissions: write-all

jobs:
  promote-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate auto-merge token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo "ADMIN_TOKEN secret is missing or unavailable to this workflow." >&2
            exit 1
          fi

      - name: Schedule development auto-merge into main
        env:
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          bash .gitea/scripts/ensure-development-automerge.sh \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            development \
            main
