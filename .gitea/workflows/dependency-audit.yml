name: Dependency Audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 12):
              raise SystemExit(
                  f"Python 3.12+ is required, but the runner provides {sys.version.split()[0]}."
              )
          PY

      - name: Install project and audit tool
        run: |
          make ci-install
          . .venv/bin/activate
          python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          make backend-audit

