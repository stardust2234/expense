name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH0_DOMAIN: ci-tenant.example.auth0.com
      AUTH0_CLIENT_ID: ci-spa-client
      AUTH0_AUDIENCE: https://api.ci.folio.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make ci-install

      - name: Run lint, tests, migrations, and production build
        run: |
          . .venv/bin/activate
          make check

  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH0_DOMAIN: ci-tenant.example.auth0.com
      AUTH0_CLIENT_ID: ci-spa-client
      AUTH0_AUDIENCE: https://api.ci.folio.example
      CADDY_SITE_ADDRESS: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker services
        run: make compose-build

