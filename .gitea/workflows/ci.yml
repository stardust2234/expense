name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 12):
              raise SystemExit(
                  f"Python 3.12+ is required, but the runner provides {sys.version.split()[0]}."
              )
          PY

      - name: Install dependencies
        run: |
          make ci-install

      - name: Run standard checks
        run: |
          . .venv/bin/activate
          make check

  build-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker services
        run: |
          make compose-build
