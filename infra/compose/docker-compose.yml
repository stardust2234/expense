services:
  frontend:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4173 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  api:
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-expense-categoriser}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/expense.db}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      AUTH_THROTTLE_SECRET: ${AUTH_THROTTLE_SECRET:?set AUTH_THROTTLE_SECRET in .env}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ../../data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  caddy:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/caddy.Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS to the public hostname}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

