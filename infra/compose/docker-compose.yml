services:
  frontend:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4173 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  api:
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-expense-categoriser}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/expense.db}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?set AUTH0_CLIENT_ID in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in .env}
      AUTH0_EMAIL_CLAIM: ${AUTH0_EMAIL_CLAIM:-https://folio.app/email}
      AUTH0_NAME_CLAIM: ${AUTH0_NAME_CLAIM:-https://folio.app/name}
    volumes:
      - ../../data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  caddy:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/caddy.Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS to the public hostname}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

