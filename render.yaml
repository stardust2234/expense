services:
  - type: web
    name: expense-app
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./infra/docker/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: APP_NAME
        value: expense-categoriser
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/expense.db
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_EMAIL_CLAIM
        value: https://folio.app/email
      - key: AUTH0_NAME_CLAIM
        value: https://folio.app/name
    disk:
      name: expense-data
      mountPath: /data
      sizeGB: 1

